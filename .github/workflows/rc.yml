name: Release (Release Candidate)

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Prerelease suffix (defaults to rc.1 if empty), e.g. rc.2"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    name: RC Prerelease
    uses: ./.github/workflows/_release_pipeline.yml
    with:
      channel: rc
      prerelease: true
      version_suffix: ${{ inputs.version_suffix || 'rc.1' }}
    secrets: inherit
