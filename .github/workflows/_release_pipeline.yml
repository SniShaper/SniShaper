name: Reusable Release Pipeline

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel: release | beta | alpha | rc"
        required: true
        type: string
      prerelease:
        description: Whether this is a prerelease version
        required: true
        type: boolean
      version_suffix:
        description: Prerelease suffix, e.g. beta.1 / alpha.2 / rc.3; empty for stable
        required: false
        type: string
        default: ""
      tag_override:
        description: Release tag to use (set by tag push for stable); empty auto-derives from version.json
        required: false
        type: string
        default: ""
    secrets:
      MSIX_PFX_PASSWORD:
        description: "MSIX signing certificate password (default: password)"
        required: false
      MSIX_PFX_BASE64:
        description: Base64 content of devcert.pfx signing certificate (used when repo has no certificate)
        required: false
      OLLAMA_MODEL:
        description: "Local Ollama model for release notes summary (default: qwen3.5:2b)"
        required: false
      LLM_API_KEY:
        description: Fallback LLM API key (OpenAI-compatible), used when Ollama is unavailable; falls back to categorized list if not set
        required: false
      LLM_MODEL:
        description: "Fallback LLM model name (default: gpt-4o-mini)"
        required: false
      LLM_BASE_URL:
        description: "Fallback LLM API base URL (default: https://api.openai.com/v1)"
        required: false

permissions:
  contents: write

jobs:
  check:
    name: Check and Resolve
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      display_version: ${{ steps.resolve.outputs.display_version }}
      suffix: ${{ steps.resolve.outputs.suffix }}
      skip: ${{ steps.release-check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from version.json
        id: resolve
        run: |
          set -euo pipefail
          # version.json is the single source of truth for release version
          # and channel; the Windows Package.appxmanifest is kept in sync by
          # the inject steps in each build job.
          VERSION=$(python3 -c "import json;print(json.load(open('version.json'))['version'])" 2>/dev/null || echo "0.0.0")
          CHANNEL="${{ inputs.channel }}"
          SUFFIX="$(echo "${{ inputs.version_suffix }}" | tr -d '[:space:]')"
          TAG_OVERRIDE="$(echo "${{ inputs.tag_override }}" | tr -d '[:space:]')"

          if [ -n "$TAG_OVERRIDE" ]; then
            TAG="$TAG_OVERRIDE"
            DISPLAY_VERSION="${TAG_OVERRIDE#v}"
          elif [ "$CHANNEL" != "release" ] && [ -z "$SUFFIX" ]; then
            SUFFIX="$CHANNEL.1"
            echo "::warning::version_suffix empty, using $SUFFIX automatically"
            TAG="v$VERSION-$SUFFIX"
            DISPLAY_VERSION="$VERSION-$SUFFIX"
          elif [ -n "$SUFFIX" ]; then
            TAG="v$VERSION-$SUFFIX"
            DISPLAY_VERSION="$VERSION-$SUFFIX"
          else
            TAG="v$VERSION"
            DISPLAY_VERSION="$VERSION"
          fi

          CHANNEL_LABEL=""
          case "$CHANNEL" in
            release) CHANNEL_LABEL="" ;;
            beta) CHANNEL_LABEL="Beta" ;;
            alpha) CHANNEL_LABEL="Alpha" ;;
            rc) CHANNEL_LABEL="Release Candidate" ;;
          esac
          RELEASE_NAME="SniShaper v$DISPLAY_VERSION"
          if [ -n "$CHANNEL_LABEL" ]; then RELEASE_NAME="$RELEASE_NAME ($CHANNEL_LABEL)"; fi

          echo "::notice::Version=$VERSION Tag=$TAG Release=$RELEASE_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TAG="${{ steps.resolve.outputs.tag }}"
          EXISTS=$(gh release view "$TAG" --json tagName --jq '.tagName' 2>/dev/null)
          if [ -n "$EXISTS" ]; then
            echo "::notice::Release $TAG already exists, skipping (avoid duplicate build)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Release $TAG does not exist, proceeding with build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  # ------------------------------------------------------------------
  # Windows build (windows-2025): MSIX (signed + unsigned), portable 7z,
  # signed bundle 7z, Inno Setup installer. No release publishing here.
  # ------------------------------------------------------------------
  build-windows:
    name: Build Windows (${{ inputs.channel }})
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          # Continue mode: winget may exit non-zero (e.g. already installed
          # via another source) and we must fall through to the GitHub
          # release fallback instead of throwing on the native exit code.
          $ErrorActionPreference = 'Continue'
          if (Get-Command winapp -ErrorAction SilentlyContinue) {
            Write-Host "winapp already available"
          } else {
            winget install --id Microsoft.WinAppCLI --accept-source-agreements --accept-package-agreements
            if ($LASTEXITCODE -ne 0) {
              Write-Host "winget failed, trying GitHub release..." -ForegroundColor Yellow
              $url = "https://github.com/microsoft/WinAppCLI/releases/latest/download/Microsoft.WinAppCLI.msixbundle"
              Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\WinAppCLI.msixbundle" -ErrorAction Stop
              Add-AppxPackage -Path "$env:TEMP\WinAppCLI.msixbundle" -ErrorAction Stop
              $pkg = Get-AppxPackage -Name "Microsoft.WinAppCLI" | Select-Object -First 1
              $installPath = $pkg.InstallLocation
              Add-Content -Path $env:GITHUB_PATH -Value $installPath
            }
          }
          winapp --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::winapp is not available after install"
            exit 1
          }

      - name: Install 7-Zip
        run: choco install 7zip -y --no-progress

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Restore signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certPath = Join-Path $env:GITHUB_WORKSPACE 'devcert.pfx'
          if ($env:MSIX_PFX_BASE64) {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
            Write-Host "::notice::devcert.pfx restored from secret MSIX_PFX_BASE64"
          } elseif (Test-Path $certPath) {
            Write-Host "::notice::using repo devcert.pfx"
          } else {
            Write-Host "::warning::devcert.pfx not found and MSIX_PFX_BASE64 not set; build_windows.ps1 will generate a certificate"
          }

      - name: Inject release channel into manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $channel = "${{ inputs.channel }}"
          $suffix = "${{ needs.check.outputs.suffix }}"
          $relChannel = if ($channel -eq 'release') { 'stable' } else { $channel }
          if ($suffix) { $relChannel = $suffix }
          $relVersion = "${{ needs.check.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($relVersion)) { $relVersion = '0.0.0' }
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'Package.appxmanifest'
          $content = Get-Content -Raw $manifest
          $content = $content -replace '<rel:ReleaseChannel>[^<]*</rel:ReleaseChannel>', "<rel:ReleaseChannel>$relChannel</rel:ReleaseChannel>"
          $content = $content -replace '<rel:Version>[^<]*</rel:Version>', "<rel:Version>$relVersion</rel:Version>"
          Set-Content -Path $manifest -Value $content -Encoding UTF8
          Write-Host "::notice::Manifest ReleaseChannel=$relChannel ReleaseVersion=$relVersion"

      - name: Build, package & sign MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "::group::build_windows.ps1 -Build all -InstallDeps -BuildMsix -Silent"
          ./build_windows.ps1 -Build all -InstallDeps -BuildMsix -Silent
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::build_windows.ps1 failed"
            exit 1
          }
          Write-Host "::endgroup::"
          $msix = Get-ChildItem -Path Apppackage -Filter "*.msix" -ErrorAction Stop | Select-Object -First 1
          if (-not $msix) {
            Write-Host "::error::no .msix produced in Apppackage"
            exit 1
          }
          Write-Host "::notice::MSIX ready: $($msix.FullName)"

      - name: Create unsigned MSIX (Partner Center)
        shell: pwsh
        run: |
          # Partner Center re-signs submitted packages, so publish an
          # unsigned MSIX alongside the signed one. `winapp pack` is
          # pure packaging - no signing - same layout as
          # build_windows.ps1 -SkipSign (unsigned_ prefix).
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $binDir = Join-Path $root 'build/bin'
          if (-not (Test-Path (Join-Path $binDir 'snishaper.exe'))) {
            Write-Host "::error::build/bin/snishaper.exe not found"
            exit 1
          }
          $msix = Get-ChildItem -Path (Join-Path $root 'Apppackage') -Filter '*.msix' | Select-Object -First 1
          if (-not $msix) {
            Write-Host "::error::no signed msix to derive name from"
            exit 1
          }
          $unsignedName = 'unsigned_' + $msix.Name
          $unsignedPath = Join-Path (Join-Path $root 'Apppackage') $unsignedName
          Write-Host "::group::winapp pack (unsigned) -> $unsignedName"
          winapp pack $binDir --manifest (Join-Path $root 'Package.appxmanifest') --output $unsignedPath
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::winapp pack (unsigned) failed"
            exit 1
          }
          Write-Host "::endgroup::"
          Write-Host "::notice::Unsigned MSIX ready: $unsignedPath"

      - name: Create 7z archive
        run: 7z a -mx=9 snishaper-windows-amd64.7z .\build\bin\*

      - name: Create cert install batch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem -Path Apppackage -Filter '*.msix' | Where-Object { $_.Name -notlike 'unsigned_*' } | Select-Object -First 1
          if (-not $msix) {
            Write-Host "::error::no signed .msix found for install.bat"
            exit 1
          }
          $password = if ($env:MSIX_PFX_PASSWORD) { $env:MSIX_PFX_PASSWORD } else { 'password' }
          $bat = @(
            '@echo off'
            'chcp 65001 > nul'
            'echo Installing certificate to Trusted Root Certification Authorities...'
            "certutil -f -importpfx `"%~dp0devcert.pfx`" $password"
            'echo Installing MSIX package...'
            "powershell -Command `"Add-AppxPackage -Path '%~dp0$($msix.Name)'`""
            'echo Done!'
            'pause'
          )
          $bat -join "`r`n" | Set-Content -Path install.bat
          Write-Host "::notice::install.bat created for $($msix.Name)"

      - name: Create signed bundle 7z
        shell: pwsh
        env:
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          # Bundle the signed MSIX + cert + install.bat + signing password
          # into one 7z named after the MSIX base name, so users get a
          # single self-contained archive
          # (e.g. dongle.Snishaper_1.29.0.0_x64.7z).
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $msix = Get-ChildItem -Path (Join-Path $root 'Apppackage') -Filter '*.msix' | Where-Object { $_.Name -notlike 'unsigned_*' } | Select-Object -First 1
          if (-not $msix) {
            Write-Host "::error::no signed .msix found for bundle"
            exit 1
          }
          $bundleName = $msix.BaseName + '.7z'
          $bundlePath = Join-Path $root $bundleName
          $installBat = Join-Path $root 'install.bat'
          if (-not (Test-Path $installBat)) {
            Write-Host "::error::install.bat not found"
            exit 1
          }
          $password = if ($env:MSIX_PFX_PASSWORD) { $env:MSIX_PFX_PASSWORD } else { 'password' }
          $passwordFile = Join-Path $root 'msix-signing-password.txt'
          [IO.File]::WriteAllText($passwordFile, $password)
          Write-Host "::group::7z a $bundleName (msix + devcert.pfx + install.bat + password)"
          7z a -mx=9 $bundlePath $msix.FullName (Join-Path $root 'devcert.pfx') $installBat $passwordFile
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::7z bundle failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "::endgroup::"
          Write-Host "::notice::Signed bundle ready: $bundlePath"

      - name: Create Inno Setup installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/create-inno-installer.ps1'
          if (-not (Test-Path $script)) {
            Write-Host "::error::create-inno-installer.ps1 missing: $script"
            exit 1
          }
          $psArgs = @{
            RepoRoot = $env:GITHUB_WORKSPACE
            Version  = "${{ needs.check.outputs.version }}"
            Suffix   = "${{ needs.check.outputs.suffix }}"
          }
          & $script @psArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::create-inno-installer.ps1 failed"
            exit 1
          }
          Write-Host "::notice::Inno Setup installer created"

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $assetsDir = Join-Path $root 'staging'
          New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null
          Get-ChildItem $assetsDir -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

          $msix = Get-ChildItem -Path (Join-Path $root 'Apppackage') -Filter '*.msix' | Where-Object { $_.Name -notlike 'unsigned_*' } | Select-Object -First 1
          Copy-Item $msix.FullName $assetsDir\ -ErrorAction Stop
          $unsigned = Get-ChildItem -Path (Join-Path $root 'Apppackage') -Filter 'unsigned_*.msix' | Select-Object -First 1
          if ($unsigned) { Copy-Item $unsigned.FullName $assetsDir\ -ErrorAction Stop }
          Copy-Item (Join-Path $root 'snishaper-windows-amd64.7z') $assetsDir\ -ErrorAction Stop
          $bundle = Get-ChildItem -Path $root -Filter '*_x64.7z' -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'snishaper-windows-amd64.7z' } | Select-Object -First 1
          if ($bundle) { Copy-Item $bundle.FullName $assetsDir\ -ErrorAction Stop }
          $setupExe = Get-ChildItem -Path (Join-Path $root 'installer') -Filter '*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setupExe) { Copy-Item $setupExe.FullName $assetsDir\ -ErrorAction Stop }
          if (Test-Path (Join-Path $root 'devcert.pfx')) { Copy-Item (Join-Path $root 'devcert.pfx') $assetsDir\ }
          if (Test-Path (Join-Path $root 'install.bat')) { Copy-Item (Join-Path $root 'install.bat') $assetsDir\ }

          Write-Host "Staged files:" -ForegroundColor Green
          Get-ChildItem $assetsDir | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: staging/
          retention-days: 3

  # ------------------------------------------------------------------
  # Linux build (ubuntu-24.04): portable tar.gz via build_linux.sh.
  # ------------------------------------------------------------------
  build-linux:
    name: Build Linux (${{ inputs.channel }})
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK4/WebKitGTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Inject release channel into version.json
        run: |
          set -euo pipefail
          CHANNEL="${{ inputs.channel }}"
          SUFFIX="${{ needs.check.outputs.suffix }}"
          REL_CHANNEL="$CHANNEL"
          if [ "$CHANNEL" = "release" ]; then REL_CHANNEL="stable"; fi
          if [ -n "$SUFFIX" ]; then REL_CHANNEL="$SUFFIX"; fi
          REL_VERSION="${{ needs.check.outputs.version }}"
          if [ -z "$REL_VERSION" ]; then REL_VERSION="0.0.0"; fi
          python3 - "$REL_VERSION" "$REL_CHANNEL" <<'PYEOF'
          import json, sys
          version, channel = sys.argv[1], sys.argv[2]
          with open('version.json') as f:
              data = json.load(f)
          data['version'] = version
          data['releaseChannel'] = channel
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PYEOF
          echo "::notice::version.json ReleaseChannel=$REL_CHANNEL Version=$REL_VERSION"

      - name: Build Linux
        run: |
          set -euo pipefail
          chmod +x build_linux.sh
          echo "::group::build_linux.sh --with-frontend"
          ./build_linux.sh --with-frontend
          echo "::endgroup::"
          test -f build/bin/SniShaper && echo "::notice::build/bin/SniShaper ready"

      - name: Create tar.gz archive
        run: |
          set -euo pipefail
          ARCHIVE="snishaper-linux-amd64.tar.gz"
          tar -czf "$ARCHIVE" -C build/bin .
          ls -lh "$ARCHIVE"
          echo "::notice::$ARCHIVE ready"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: snishaper-linux-amd64.tar.gz
          retention-days: 3

  # ------------------------------------------------------------------
  # Publish (windows-2025): merge artifacts from both platforms, generate
  # release notes via Ollama, and create the GitHub release.
  # ------------------------------------------------------------------
  publish:
    name: Publish Release (${{ inputs.channel }})
    needs: [check, build-windows, build-linux]
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: staging

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: staging

      - name: Determine previous release tag
        id: prev-tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Continue + manual exit-code checks: on GitHub runners
          # $PSNativeCommandUseErrorActionPreference turns non-zero native
          # exit codes into terminating errors. `gh release list` and
          # `git describe` both return non-zero when nothing exists yet,
          # which is a normal case here, so we handle it manually.
          #
          # The change baseline is the previous STABLE (non-prerelease)
          # release, not the most recent prerelease - so Beta/Alpha/RC
          # summaries compare against the last official release.
          $ErrorActionPreference = 'Continue'
          $currentTag = "${{ needs.check.outputs.tag }}"
          $prev = $null
          try {
            $releases = gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName' 2>$null
            if ($LASTEXITCODE -eq 0) {
              foreach ($t in $releases) {
                if ($t -ne $currentTag) { $prev = $t; break }
              }
            }
          } catch {
            Write-Host "::warning::gh release list failed, falling back to git tags: $_"
          }
          if (-not $prev) {
            # Fallback: nearest git tag that is NOT a prerelease-style tag
            # (contains -alpha/-beta/-rc suffix). Prefer stable tags.
            $candidates = git tag --sort=-version:refname 2>$null
            if ($LASTEXITCODE -eq 0) {
              foreach ($t in $candidates) {
                if ($t -ne $currentTag -and $t -notmatch '-(alpha|beta|rc)\.?\d*$') {
                  $prev = $t
                  break
                }
              }
            }
            if (-not $prev) {
              $prev = git describe --tags --abbrev=0 HEAD~ 2>$null
              if ($LASTEXITCODE -ne 0 -or -not $prev) { $prev = '' }
            }
          }
          Write-Host "::notice::Previous STABLE release tag: '$prev'"
          "prev_tag=$prev" >> $env:GITHUB_OUTPUT
          # Explicitly clear the native exit code: GitHub appends
          # `exit $LASTEXITCODE` to every pwsh step, and `git describe`
          # may have left a non-zero value even though this is a normal
          # "no previous tag" case.
          exit 0

      - name: Resolve Ollama model
        shell: pwsh
        env:
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
        run: |
          $model = if ($env:OLLAMA_MODEL) { $env:OLLAMA_MODEL } else { 'qwen3.5:2b' }
          Write-Host "::notice::Ollama model = $model"
          "OLLAMA_MODEL=$model" >> $env:GITHUB_ENV

      - name: Cache Ollama (binary + models)
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Programs/Ollama
            ~/.ollama
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}
          restore-keys: |
            ollama-${{ runner.os }}-

      - name: Setup Ollama (local LLM for release notes)
        shell: pwsh
        env:
          OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
        run: |
          $ErrorActionPreference = 'Continue'
          $model = $env:OLLAMA_MODEL
          $env:Path += ";$env:LOCALAPPDATA\Programs\Ollama"
          Write-Host "::group::Install Ollama"
          $ollamaExe = Get-Command ollama -ErrorAction SilentlyContinue
          if (-not $ollamaExe) {
            winget install --id Ollama.Ollama -e --accept-source-agreements --accept-package-agreements 2>&1 | Out-Host
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::winget install Ollama failed, trying portable zip"
              $zip = Join-Path $env:RUNNER_TEMP 'ollama.zip'
              Invoke-WebRequest -Uri 'https://ollama.com/download/ollama-windows-amd64.zip' -OutFile $zip -ErrorAction Stop
              $dir = Join-Path $env:RUNNER_TEMP 'ollama'
              Expand-Archive -Path $zip -DestinationPath $dir -Force
              Add-Content -Path $env:GITHUB_PATH -Value $dir
            }
          }
          Write-Host "::endgroup::"

          Write-Host "::group::Start ollama serve"
          $server = Start-Process -FilePath 'ollama' -ArgumentList 'serve' -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 8
          try {
            Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -Method Get -TimeoutSec 10 | Out-Null
            Write-Host "::notice::Ollama server is up (PID $($server.Id))"
          } catch {
            Write-Host "::warning::Ollama server did not respond: $($_.Exception.Message)"
          }
          Write-Host "::endgroup::"

          Write-Host "::group::ollama pull $model"
          ollama pull $model
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::ollama pull $model failed, release notes will fall back to categorized list"
          } else {
            Write-Host "::notice::Model $model ready"
            "OLLAMA_READY=true" >> $env:GITHUB_ENV
          }
          Write-Host "::endgroup::"
          # ollama pull may leave a non-zero $LASTEXITCODE (normal when the
          # model cannot be fetched); GitHub appends `exit $LASTEXITCODE`,
          # so clear it explicitly - failure here is only a fallback trigger.
          exit 0

      - name: Generate release notes
        id: release-notes
        shell: pwsh
        env:
          OLLAMA_READY: ${{ env.OLLAMA_READY }}
          OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE '.github/scripts/generate-release-notes.ps1'
          if (-not (Test-Path $script)) {
            Write-Host "::error::release notes script missing: $script"
            exit 1
          }
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'release-notes'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $notesPath = Join-Path $outDir 'RELEASE_NOTES.md'
          # Hashtable splatting (not array!) - array splatting passes
          # elements positionally, so '-Name', value pairs would be
          # mis-bound. Hashtable splatting binds by parameter name.
          $psArgs = @{
            RepoRoot         = $env:GITHUB_WORKSPACE
            Version          = "${{ needs.check.outputs.version }}"
            Channel          = "${{ inputs.channel }}"
            PrereleaseSuffix = "${{ needs.check.outputs.suffix }}"
            PreviousTag      = "${{ steps.prev-tag.outputs.prev_tag }}"
            OutputPath       = $notesPath
          }
          if ($env:OLLAMA_READY -eq 'true') {
            $psArgs.OllamaUrl  = 'http://127.0.0.1:11434'
            $psArgs.OllamaModel = $env:OLLAMA_MODEL
          } elseif ($env:LLM_API_KEY) {
            $psArgs.LlmApiKey  = $env:LLM_API_KEY
            if ($env:LLM_MODEL) { $psArgs.LlmModel = $env:LLM_MODEL }
            if ($env:LLM_BASE_URL) { $psArgs.LlmBaseUrl = $env:LLM_BASE_URL }
          }
          & $script @psArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::generate-release-notes.ps1 failed"
            exit 1
          }
          Write-Host "::notice::Release notes written to $notesPath"
          Copy-Item $notesPath (Join-Path $env:GITHUB_WORKSPACE 'staging\RELEASE_NOTES.md') -Force

      - name: Append asset manifest to release notes
        shell: pwsh
        run: |
          # Release notes are generated before the artifacts are listed, so
          # the asset table (name + purpose + MD5) is appended here after
          # all platform artifacts are staged.
          $ErrorActionPreference = 'Stop'
          $assetsDir = Join-Path $env:GITHUB_WORKSPACE 'staging'
          $notesFile = Join-Path $assetsDir 'RELEASE_NOTES.md'
          if (-not (Test-Path $notesFile)) {
            Write-Host "::error::RELEASE_NOTES.md not found"
            exit 1
          }

          $sb = New-Object System.Text.StringBuilder
          # No leading --- here: the section above (Changes) already ends
          # with a separator when the table is inserted before Contributors.
          [void]$sb.AppendLine("## Release Assets")
          [void]$sb.AppendLine("")
          [void]$sb.AppendLine("| File | Purpose | MD5 |")
          [void]$sb.AppendLine("|------|---------|-----|")

          function Add-AssetRow($file, $purpose) {
            if (-not $file) { return }
            $md5 = (Get-FileHash -LiteralPath $file.FullName -Algorithm MD5).Hash.ToLowerInvariant()
            $sizeMB = [Math]::Round($file.Length / 1MB, 1)
            [void]$sb.AppendLine("| $($file.Name) | $purpose (Size: $sizeMB MB) | $md5 |")
          }

          $bundle = Get-ChildItem -Path $assetsDir -Filter '*_x64.7z' -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'snishaper-windows-amd64.7z' } | Select-Object -First 1
          $portable = Get-ChildItem -Path $assetsDir -Filter 'snishaper-windows-amd64.7z' -ErrorAction SilentlyContinue | Select-Object -First 1
          $unsigned = Get-ChildItem -Path $assetsDir -Filter 'unsigned_*.msix' -ErrorAction SilentlyContinue | Select-Object -First 1
          $setupExe = Get-ChildItem -Path $assetsDir -Filter '*-x64Setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          $linuxTgz = Get-ChildItem -Path $assetsDir -Filter 'snishaper-linux-amd64.tar.gz' -ErrorAction SilentlyContinue | Select-Object -First 1

          Add-AssetRow $setupExe "Windows installer (Inno Setup): classic guided installation with license and desktop shortcut, for regular users"
          Add-AssetRow $bundle "Signed bundle: MSIX installer + signing certificate (devcert.pfx) + install.bat + signing password, for one-click sideload"
          Add-AssetRow $portable "Windows portable build: extract and run snishaper.exe directly, no installation required"
          Add-AssetRow $unsigned "Unsigned MSIX for Microsoft Partner Center submission (re-signed by Microsoft on upload)"
          Add-AssetRow $linuxTgz "Linux portable build (amd64): extract and run ./SniShaper, requires GTK4/WebKitGTK runtime"
          # Blank line so the following ## Contributors heading is separated.
          [void]$sb.AppendLine("")

          $existing = [System.IO.File]::ReadAllText($notesFile, [System.Text.Encoding]::UTF8)
          $marker = '## Contributors'
          $insertAt = $existing.IndexOf($marker)
          $manifest = $sb.ToString()
          if ($insertAt -ge 0) {
            # Insert the asset table right before the Contributors section.
            $newContent = $existing.Substring(0, $insertAt) + $manifest + $existing.Substring($insertAt)
          } else {
            # No Contributors section found (unexpected); append at the end.
            $newContent = $existing + "`n---`n`n" + $manifest
          }
          [System.IO.File]::WriteAllText($notesFile, $newContent, [System.Text.Encoding]::UTF8)
          Write-Host "::notice::Asset manifest inserted before Contributors in $notesFile"

      - name: List staged assets
        shell: pwsh
        run: |
          Get-ChildItem -Path staging | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Continue + explicit exit-code handling so a failed gh call
          # produces a clear ::error:: line instead of a bare throw.
          $ErrorActionPreference = 'Continue'
          $tag = "${{ needs.check.outputs.tag }}"
          $releaseName = "${{ needs.check.outputs.release_name }}"
          $prerelease = "${{ inputs.prerelease }}".ToLowerInvariant()
          $assetsDir = Join-Path $env:GITHUB_WORKSPACE 'staging'
          $notesFile = Join-Path $assetsDir 'RELEASE_NOTES.md'

          Write-Host "::group::gh release create $tag"
          $args = @(
            'release', 'create', $tag,
            # Signed MSIX + devcert.pfx + install.bat + password are bundled
            # into the *_x64.7z archive, so only upload the unsigned MSIX
            # (for Partner Center) plus the Inno Setup exe, the two 7z
            # archives and the Linux tar.gz.
            (Join-Path $assetsDir 'unsigned_*.msix'),
            (Join-Path $assetsDir '*.exe'),
            (Join-Path $assetsDir '*.7z'),
            (Join-Path $assetsDir 'snishaper-linux-amd64.tar.gz'),
            '--title', $releaseName,
            '--notes-file', $notesFile
          )
          if ($prerelease -eq 'true') { $args += '--prerelease' }
          gh @args
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::gh release create failed (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "::endgroup::"
          Write-Host "::notice::Release $releaseName ($tag) published, prerelease=$prerelease"
